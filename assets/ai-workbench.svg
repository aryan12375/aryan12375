<svg width="760" height="520" viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI engineering workbench</title>
  <desc id="desc">A crisp animated vector illustration of an AI engineering workspace with models, retrieval, vision, and APIs.</desc>
  <style>
    .float { animation: float 5s ease-in-out infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .scan { animation: scan 3.6s ease-in-out infinite; }
    .dash { stroke-dasharray: 11 13; animation: dash 18s linear infinite; }
    .blink { animation: blink 2.2s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes scan { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(92px); opacity: .9; } }
    @keyframes dash { to { stroke-dashoffset: -360; } }
    @keyframes blink { 0%, 72%, 100% { opacity: .35; } 84% { opacity: 1; } }
  </style>

